name: ws2022_app
description: "WorldSkills 2022 Competition App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  path_provider: ^2.1.3
  permission_handler: ^11.3.1
  http: ^1.1.0
  provider: ^6.1.1
  webview_flutter: ^4.4.2
  flutter_local_notifications: ^17.2.4
  url_launcher: ^6.3.1
  audioplayers: ^6.0.0
  record: 5.0.0
  flutter_sound: ^9.2.0
dependency_overrides:
  record_linux: 1.0.0
  record_platform_interface: 1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/events_data.json
    - assets/images/
